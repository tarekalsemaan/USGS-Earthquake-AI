name: Run Model Economic Loss

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'notebooks/07_Model_Economic_Loss.ipynb'
      - 'data/**'
      - 'models/**'
      - 'requirements.txt'

jobs:
  execute-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill nbconvert

      - name: Execute notebook with Papermill
        working-directory: notebooks
        run: |
          mkdir -p ../output
          papermill 07_Model_Economic_Loss.ipynb ../output/07_Model_Economic_Loss_output.ipynb

      - name: Convert notebook to HTML report
        run: |
          jupyter nbconvert --to html output/07_Model_Economic_Loss_output.ipynb --output output/07_Model_Economic_Loss_report.html

      - name: Upload notebook report
        uses: actions/upload-artifact@v4
        with:
          name: economic-loss-report
          path: output/